<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>IPC round trip</title></head>
<body>
<h1>Synchronous IPC round trip</h1>
<p id="out">running</p>
<script>
// Each read of window.screenX asks the UI process for the window frame with a SYNCHRONOUS IPC
// (WebChromeClient::windowRect -> sendSync). Perf-Dashboard reads it in every step; on build 38 one
// step took 84 s instead of 0.13 s with the main thread asleep in waitForSyncReply. Timing single
// reads gives the round trip directly. Prints "IPC-RTT ..." (console) and sets the title.
function pct(a, p) { return a[Math.min(a.length - 1, Math.floor(a.length * p))]; }
const n = 200, t = [];
let sink = 0;
for (let i = 0; i < n; i++) {
    const t0 = performance.now();
    sink += window.screenX;
    t.push(performance.now() - t0);
}
t.sort((a, b) => a - b);
const total = t.reduce((a, b) => a + b, 0);
const line = "IPC-RTT n=" + n + " total_ms=" + total.toFixed(1) + " min=" + t[0].toFixed(2) +
    " median=" + pct(t, 0.5).toFixed(2) + " p90=" + pct(t, 0.9).toFixed(2) + " p99=" + pct(t, 0.99).toFixed(2) +
    " max=" + t[n - 1].toFixed(2) + " over20ms=" + t.filter(x => x >= 20).length + " sink=" + sink;
console.log(line);
document.title = line;
document.getElementById("out").textContent = line;
</script>
</body></html>
